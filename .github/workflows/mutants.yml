name: Mutation testing

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: full run over the core crates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full run splits the mutants into four shards that run in parallel, each
  # gated on its own; a pull request tests only its diff, in one shard.
  shard:
    name: mutants shard ${{ matrix.shard }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '["0/1"]' || '["0/4","1/4","2/4","3/4"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.59.0,cargo-mutants@27.1.0
      - name: Diff against the base branch (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}...HEAD" > pr.diff
      - name: Mutation test and gate
        env:
          DIFF: ${{ github.event_name == 'pull_request' && 'pr.diff' || '' }}
          SHARD: ${{ matrix.shard }}
        run: just mutants "$DIFF" "$SHARD"

  # The required status check: passes only when every shard passed.
  mutants:
    name: mutants
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: test "$RESULT" = success
